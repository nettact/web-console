<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>NetTact 控制台</title>
    <!-- Set the theme synchronously, before the stylesheet paints, to avoid a
         dark→light flash on load. Mirrors detect()/STORAGE_KEY in src/theme.ts;
         keep the key ('nettact.theme') and detection order in sync with it. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('nettact.theme')
          if (t !== 'dark' && t !== 'light') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
          }
          document.documentElement.dataset.theme = t
        } catch (e) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
