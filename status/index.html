<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>NetTact Status</title>
    <!-- Set the theme synchronously, before the stylesheet paints, to avoid a
         dark→light flash on load. Mirrors detect()/STORAGE_KEY in src/theme.ts,
         and deliberately uses the SAME 'nettact.theme' key as the console: a
         same-origin deployment should not flip appearance between the two. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('nettact.theme')
          if (t !== 'dark' && t !== 'light') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
          }
          document.documentElement.dataset.theme = t
        } catch (e) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
    <!-- Runtime configuration, loaded as a plain (unbundled) script so a deployer
         can edit it in the built output without a toolchain. Must come before the
         module below, which reads window.NETTACT_STATUS_CONFIG at import time. -->
    <script src="./config.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
